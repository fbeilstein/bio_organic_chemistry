<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Periodic Table - Electron Configuration</title>
    <style>
        :root {
            --bg-color: transparent;
            --text-color: #fff;
            --border-color: #555;
            --element-hover-bg: rgba(255, 255, 255, 0.3);
            --element-active-border: #fff;
            --panel-bg: rgba(0, 0, 0, 0.5);
            --dim-opacity: 0.15;
            
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-text: #fff;
            --btn-border: #aaa;
            --btn-hover: rgba(255, 255, 255, 0.2);
            --btn-active: #007bff;
        }

        :root.light-theme {
            --text-color: #111;
            --border-color: #999;
            --element-hover-bg: rgba(0, 0, 0, 0.15);
            --element-active-border: #000;
            --panel-bg: rgba(255, 255, 255, 0.8);
            
            --btn-bg: #eee;
            --btn-text: #111;
            --btn-border: #999;
            --btn-hover: #ddd;
            --btn-active: #007bff;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            box-sizing: border-box;
            overflow-y: hidden;
        }
        
        #layout-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            align-items: flex-start;
        }

        #left-col {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        #controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--btn-border);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: var(--btn-hover);
        }
        
        button.active {
            border-color: var(--btn-active);
            box-shadow: 0 0 5px var(--btn-active);
            background: var(--btn-active);
            color: #fff;
        }

        #ptable {
            display: grid;
            grid-template-columns: repeat(18, minmax(20px, 42px));
            grid-template-rows: repeat(10, minmax(20px, 42px));
            gap: 3px;
            transition: opacity 0.3s;
        }
        
        .element {
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            user-select: none;
            transition: transform 0.1s, opacity 0.3s, border 0.1s;
            color: #111; 
        }
        
        :root:not(.light-theme) .element.unknown-cat {
            color: #fff;
        }
        
        .element:hover {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        .element.active {
            border: 2px solid var(--element-active-border);
            box-shadow: 0 0 10px var(--element-active-border);
            z-index: 5;
        }
        .element.dimmed {
            opacity: var(--dim-opacity);
            transform: none !important;
            box-shadow: none !important;
            cursor: default;
        }
        .element.highlighted {
            opacity: 1;
            border: 2px solid var(--element-active-border);
            transform: scale(1.05);
            z-index: 6;
            font-weight: bold;
        }
        
        .symbol {
            font-weight: bold;
            font-size: 15px;
        }
        .number {
            font-size: 9px;
            align-self: flex-start;
            margin-left: 3px;
        }
        
        #info-panel {
            flex-grow: 1;
            min-height: 450px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            margin-left: -100px;
        }
        
        #element-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        
        #aufbau-diagram {
            position: relative;
            width: 100%;
            height: 300px;
            margin-top: 20px;
            margin-left: 10px;
        }
        
        .subshell-row {
            position: absolute;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }
        
        .subshell-label {
            font-size: 14px;
            font-family: monospace;
            width: 25px;
            text-align: right;
            color: var(--text-color);
        }
        
        .boxes {
            display: flex;
            flex-direction: row;
            gap: 2px;
        }
        
        .box {
            width: 20px;
            height: 24px;
            border: 1px solid #666;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #000;
        }
        
        .box.s-box { background-color: #fcaec7; }
        .box.p-box { background-color: #98f5d0; }
        .box.d-box { background-color: #dbf88c; }
        .box.f-box { background-color: #c8c8f0; }

        .arrow {
            display: inline-block;
            line-height: 1;
        }

        #legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 15px;
            margin-top: 15px;
            justify-content: center;
            font-size: 12px;
            color: var(--text-color);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
        }
    </style>
</head>

        function updateTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.documentElement.classList.add('light-theme');
            } else {
                document.documentElement.classList.remove('light-theme');
            }
        }
        
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateTheme);
            updateTheme();
        }
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.theme) {
                if (event.data.theme === 'light') {
                    document.documentElement.classList.add('light-theme');
                } else {
                    document.documentElement.classList.remove('light-theme');
                }
            }
        });
        
        try {
            if(window.parent && window.parent.document.body.classList.contains('light-theme')) {
                document.documentElement.classList.add('light-theme');
            }
        } catch(e) {}

        const ptable = document.getElementById('ptable');
        const header = document.getElementById('element-header');
        const aufbau = document.getElementById('aufbau-diagram');
        let currentHighlights = [];
        
        const catColors = {
            'alkali-metal': 'rgba(255, 102, 102, 0.7)',
            'alkaline-earth-metal': 'rgba(255, 204, 153, 0.7)',
            'transition-metal': 'rgba(255, 192, 203, 0.8)',
            'post-transition-metal': 'rgba(150, 255, 150, 0.7)',
            'metalloid': 'rgba(150, 255, 255, 0.7)',
            'reactive-nonmetal': 'rgba(100, 180, 255, 0.7)',
            'polyatomic-nonmetal': 'rgba(100, 180, 255, 0.7)',

            'lanthanide': 'rgba(255, 120, 180, 0.7)',
            'actinide': 'rgba(255, 120, 120, 0.7)'
        };
        
        const catLabels = {
            'alkali-metal': 'Alkali Metal',
            'alkaline-earth-metal': 'Alkaline Earth',
            'transition-metal': 'Transition Metal',
            'post-transition-metal': 'Post-transition Metal',
            'metalloid': 'Metalloid',
            'reactive-nonmetal': 'Nonmetal',
            'noble-gas': 'Noble Gas',
            'lanthanide': 'Lanthanide',
            'actinide': 'Actinide'
        };

        function drawLegend() {
            const legend = document.getElementById('legend');
            for (const [cat, label] of Object.entries(catLabels)) {
                const color = catColors[cat];
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<div class="legend-color" style="background-color: ${color}"></div> ${label}`;
                legend.appendChild(item);
            }
        }

        function drawTable() {

            elementsData.forEach(el => {
                if(!el.xpos || !el.ypos) return;
                
                const div = document.createElement('div');
                div.className = 'element';
                div.dataset.number = el.number;
                
                let catClass = (el.category || '').toLowerCase().replace(/ /g, '-');
                if (catColors[catClass]) {
                    div.style.backgroundColor = catColors[catClass];
                } else {
                    div.classList.add('unknown-cat');
                    div.style.backgroundColor = 'rgba(128, 128, 128, 0.3)';
                }
                
                div.style.gridColumn = el.xpos;
                div.style.gridRow = el.ypos;
                
                div.innerHTML = `<span class="number">${el.number}</span><span class="symbol">${el.symbol}</span>`;
                
                div.addEventListener('click', () => {
                    document.querySelectorAll('.element').forEach(e => e.classList.remove('active'));
                    div.classList.add('active');
                    showElementInfo(el);
                });
                
                ptable.appendChild(div);
            });
        }
        
        function highlight(numbers, btn) {
            document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            document.querySelectorAll('.element').forEach(el => {
                const num = parseInt(el.dataset.number);
                if(numbers.includes(num)) {
                    el.classList.remove('dimmed');
                    el.classList.add('highlighted');
                } else {
                    el.classList.add('dimmed');
                    el.classList.remove('highlighted');
                }
            });
            currentHighlights = numbers;
        }
        
        function clearHighlights(btn) {
            document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            document.querySelectorAll('.element').forEach(el => {
                el.classList.remove('dimmed');
                el.classList.remove('highlighted');
            });
            currentHighlights = [];
        }

        function getBoxesForL(l) {
            if(l === 's') return 1;
            if(l === 'p') return 3;
            if(l === 'd') return 5;
            if(l === 'f') return 7;
            return 1;
        }

        // Initialize energy-staggered Aufbau diagram structure
        function initAufbau() {
            aufbau.innerHTML = '';
            
            for (const [l, data] of Object.entries(aufbauStructure)) {
                data.ns.forEach(n => {
                    const row = document.createElement('div');
                    row.className = 'subshell-row';
                    
                    // Calculate relative energy position
                    // Height base H = 35px, offset dH = 25px
                    const y = (n - 1) * 35 + data.lIndex * 25;
                    row.style.bottom = `${y}px`;
                    row.style.left = `${data.xOffset}px`;
                    
                    const label = document.createElement('div');
                    label.className = 'subshell-label';
                    label.innerText = `${n}${l}`;
                    
                    const boxes = document.createElement('div');
                    boxes.className = 'boxes';
                    boxes.id = `boxes-${n}${l}`;
                    
                    const numBoxes = getBoxesForL(l);
                    for(let i=0; i<numBoxes; i++) {
                        const box = document.createElement('div');
                        box.className = `box ${l}-box`;
                        boxes.appendChild(box);
                    }
                    
                    row.appendChild(label);
                    row.appendChild(boxes);
                    aufbau.appendChild(row);
                });
            }
        }
        
        function parseConfiguration(configStr) {
            if(!configStr) return {};
            const parts = configStr.split(' ');
            const res = {};
            parts.forEach(p => {
                const match = p.match(/(\d)([spdf])(\d+)/);
                if(match) {
                    res[`${match[1]}${match[2]}`] = parseInt(match[3]);
                }
            });
            return res;
        }
        
        function showElementInfo(el) {
            header.innerHTML = `${el.number} - ${el.name} (${el.symbol})`;
            
            // Clear all boxes
            document.querySelectorAll('.box').forEach(b => {
                b.innerHTML = '';
            });
            
            const config = parseConfiguration(el.electron_configuration);
            
            for (const [subshell, electrons] of Object.entries(config)) {
                const boxesContainer = document.getElementById(`boxes-${subshell}`);
                if (!boxesContainer) continue;
                
                const boxElements = boxesContainer.querySelectorAll('.box');
                const numBoxes = boxElements.length;
                
                let boxesData = Array(numBoxes).fill(0).map(() => ({ up: false, down: false }));
                let eCount = electrons;
                
                // Hund's rule: fill up arrows first
                for(let i=0; i<numBoxes && eCount>0; i++) {
                    boxesData[i].up = true;
                    eCount--;
                }
                // Fill down arrows
                for(let i=0; i<numBoxes && eCount>0; i++) {
                    boxesData[i].down = true;
                    eCount--;
                }
                
                boxElements.forEach((boxEl, i) => {
                    let html = '';
                    const d = boxesData[i];
                    // Using half arrows ↿ (&#8639;) and ⇂ (&#8642;)
                    if(d.up && d.down) {
                        html = '&#8639;&#8642;';
                    } else if (d.up) {
                        html = '&#8639;';
                    } else if (d.down) {
                        html = '&#8642;';
                    }
                    boxEl.innerHTML = html;
                });
            }
        }

        initAufbau();
        drawTable();
        drawLegend();
        
        // Select Carbon by default
        const carbonEl = Array.from(document.querySelectorAll('.element')).find(e => parseInt(e.dataset.number) === 6);
        if(carbonEl) carbonEl.click();
        
    </script>
</body>
</html>
